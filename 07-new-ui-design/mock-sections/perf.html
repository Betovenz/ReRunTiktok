    <sc-if value="{{ isPerf }}" hint-placeholder-val="{{ false }}">
      <div style="height:100%; display:grid; grid-template-rows:auto auto 1fr; gap:14px; min-height:0">
        <div style="display:flex; align-items:center; gap:12px"><span style="font-size:22px; font-weight:700">ผลงาน</span><div style="flex:1"></div><div style="display:flex; background:{{ T.surface }}; border:1px solid {{ T.border }}; border-radius:12px; padding:3px; font-size:13px"><span style="padding:7px 16px; border-radius:9px; background:{{ T.text }}; color:{{ T.bg }}; font-weight:700">7 วัน</span><span style="padding:7px 16px; color:{{ T.muted }}; cursor:pointer">30 วัน</span><span style="padding:7px 16px; color:{{ T.muted }}; cursor:pointer">ทั้งหมด</span></div><button style="height:40px; padding:0 16px; border:1px solid {{ T.border }}; border-radius:12px; background:none; color:{{ T.text }}; font-size:13px; font-weight:600; cursor:pointer" style-hover="border-color:{{ T.borderHi }}">นำเข้ายอดขาย CSV</button></div>
        <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:14px">
          <div style="background:{{ T.surface }}; border:1px solid {{ T.border }}; border-radius:18px; padding:16px 20px"><div style="font-size:12px; color:{{ T.muted }}">ไลฟ์</div><div style="font-size:28px; font-weight:600; font-family:'IBM Plex Mono',monospace; margin-top:4px">12</div></div>
          <div style="background:{{ T.surface }}; border:1px solid {{ T.border }}; border-radius:18px; padding:16px 20px"><div style="font-size:12px; color:{{ T.muted }}">เวลารวม</div><div style="font-size:28px; font-weight:600; font-family:'IBM Plex Mono',monospace; margin-top:4px">34:12</div></div>
          <div style="background:{{ T.surface }}; border:1px solid {{ T.border }}; border-radius:18px; padding:16px 20px"><div style="font-size:12px; color:{{ T.muted }}">จบปกติ</div><div style="font-size:28px; font-weight:600; font-family:'IBM Plex Mono',monospace; margin-top:4px; color:{{ T.green }}">11/12</div></div>
          <div style="background:linear-gradient(145deg,{{ T.primaryDeep }},{{ T.primary }}); border-radius:18px; padding:16px 20px; color:#fff"><div style="font-size:12px; opacity:.85">ยอดขาย</div><div style="font-size:28px; font-weight:600; font-family:'IBM Plex Mono',monospace; margin-top:4px">128,400 ฿</div></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; min-height:0">
          <div style="background:{{ T.surface }}; border:1px solid {{ T.border }}; border-radius:18px; padding:18px 22px; display:flex; flex-direction:column; min-height:0"><div style="font-size:14px; font-weight:600">ยอดขายรายวัน · 14 วัน</div><div style="flex:1; display:flex; align-items:flex-end; gap:8px; margin-top:14px; min-height:0"><sc-for list="{{ perfBars }}" as="pb" hint-placeholder-count="14"><div style="flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end"><div style="{{ pb.style }}"></div></div></sc-for></div></div>
          <div style="background:{{ T.surface }}; border:1px solid {{ T.border }}; border-radius:18px; overflow:hidden; display:flex; flex-direction:column; min-height:0"><div style="padding:14px 20px; font-size:14px; font-weight:600; border-bottom:1px solid {{ T.surface2 }}">ประวัติไลฟ์</div><div style="flex:1; display:flex; flex-direction:column; justify-content:space-around; padding:4px 20px"><sc-for list="{{ history }}" as="h" hint-placeholder-count="4"><div style="display:flex; align-items:center; gap:12px; font-size:13px"><span style="{{ h.dotStyle }}"></span><span style="width:110px; color:{{ T.muted }}; font-size:12.5px">{{ h.date }}</span><span style="width:70px; font-weight:600">{{ h.acc }}</span><span style="width:80px; font-family:'IBM Plex Mono',monospace; font-size:12.5px">{{ h.dur }}</span><span style="{{ h.stStyle }}">{{ h.st }}</span><div style="flex:1"></div><span style="font-family:'IBM Plex Mono',monospace; font-size:12.5px">{{ h.gmv }}</span></div></sc-for></div></div>
        </div>
      </div>
    </sc-if>
