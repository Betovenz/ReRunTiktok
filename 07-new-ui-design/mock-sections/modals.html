  <sc-if value="{{ previewOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; inset:0; background:rgba(0,0,0,.7); display:grid; place-items:center; z-index:50" onClick="{{ closePreview }}"><div style="background:{{ T.surface }}; border:1px solid {{ T.border }}; border-radius:20px; padding:18px; width:360px; display:flex; flex-direction:column; gap:12px"><div style="display:flex; align-items:center"><span style="font-size:15px; font-weight:700">{{ previewName }}</span><div style="flex:1"></div><button style="width:32px; height:32px; border:none; border-radius:8px; background:{{ T.surface2 }}; color:{{ T.muted }}; cursor:pointer" onClick="{{ closePreview }}">✕</button></div><div style="aspect-ratio:9/16; max-height:520px; background:linear-gradient(170deg,#1B2A4A,#0F1320); border-radius:14px; display:grid; place-items:center; color:{{ T.muted }}; font-size:13px; position:relative"><span style="width:64px; height:64px; border-radius:99px; background:{{ T.primary }}; color:#fff; display:grid; place-items:center; font-size:26px">▶</span><div style="position:absolute; bottom:14px; left:14px; right:14px; height:4px; background:{{ T.border }}; border-radius:99px"><div style="width:30%; height:100%; background:{{ T.primary }}; border-radius:99px"></div></div></div><div style="font-size:12px; color:{{ T.faint }}; text-align:center">พรีวิวคลิปก่อนนำไปไลฟ์ · 1080×1920</div></div></div>
  </sc-if>
  <sc-if value="{{ confirmStop }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed; inset:0; background:rgba(0,0,0,.65); display:grid; place-items:center; z-index:50"><div style="background:{{ T.surface }}; border:1px solid {{ T.border }}; border-radius:18px; padding:28px; width:400px"><div style="font-size:18px; font-weight:700">หยุดไลฟ์ตอนนี้เลยไหม</div><div style="font-size:14px; color:{{ T.muted }}; margin-top:6px">ห้อง LIVE บน TikTok จะถูกปิด และผู้ชม 214 คนจะออกจากห้องทันที</div><div style="display:flex; gap:10px; margin-top:22px; justify-content:flex-end"><button style="height:44px; padding:0 18px; border:1px solid {{ T.border }}; border-radius:12px; background:none; color:{{ T.text }}; font-size:14px; cursor:pointer" onClick="{{ cancelStop }}">กลับไปไลฟ์ต่อ</button><button style="height:48px; padding:0 22px; border:none; border-radius:12px; background:#FF4D4F; color:#fff; font-size:15px; font-weight:700; cursor:pointer" style-hover="background:#E03E40" onClick="{{ confirmStopLive }}">⏹ หยุดไลฟ์</button></div></div></div>
  </sc-if>
